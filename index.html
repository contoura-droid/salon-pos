<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salon POS</title>
<style>
 body{font-family:Arial,sans-serif;margin:0;background:#faf5f7;color:#333}
 .box{max-width:420px;margin:60px auto;background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 10px #0002}
 input,select,button{width:100%;padding:10px;margin:6px 0;box-sizing:border-box;font-size:15px}
 button{background:#b8587a;color:#fff;border:0;border-radius:8px;cursor:pointer}
 #lock{display:none;position:fixed;inset:0;background:#7a1c2e;color:#fff;text-align:center;padding-top:25vh;font-size:26px}
 #pos{display:none;max-width:900px;margin:20px auto;padding:10px}
 .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
 @media(max-width:700px){.grid{grid-template-columns:1fr}}
 .svc{background:#fff;border:1px solid #ddd;padding:10px;margin:4px 0;border-radius:8px;cursor:pointer}
</style></head><body>

<div id="lock"><b>Account Suspended</b><br>Contact Administrator</div>

<div class="box" id="login">
 <h2>Salon Sign In</h2>
 <input id="salonId" placeholder="Salon ID (e.g. SALON001)">
 <input id="email" placeholder="Email">
 <input id="pass" type="password" placeholder="Password">
 <button onclick="signIn()">Sign In</button>
 <p id="msg" style="color:#c00"></p>
</div>

<div id="pos">
 <h2>New Sale <small id="who"></small></h2>
 <div class="grid">
  <div><h3>Services</h3><div id="services"></div></div>
  <div><h3>Cart</h3><div id="cart"></div>
   <input id="disc" type="number" placeholder="Discount %" oninput="draw()">
   <input id="tax" type="number" placeholder="GST / Service charge %" oninput="draw()">
   <select id="method"><option>Cash</option><option>Card</option><option>Bank Transfer</option></select>
   <h3 id="total">Total: 0</h3>
   <button onclick="checkout()">Complete Sale</button>
  </div>
 </div>
</div>

<script>
const MASTER_URL = 'https://script.google.com/macros/s/AKfycbz1ie9kAKlxXkY39wLs8mRGUykUlHcue9Yo5YATcJ9wroP_58fZ6MeUGA3xGacsfdTW/exec';
let salonUrl = '', token = '', user = null, cart = [];

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) });
  return r.json();
}
function lockout() { document.getElementById('lock').style.display = 'block'; }

async function signIn() {
  const msg = document.getElementById('msg'); msg.textContent = 'Checking...';
  try {
    const m = await call(MASTER_URL, { action: 'resolve', salonId: salonId.value });
    if (m.status === 'NotFound') { msg.textContent = 'Salon ID not found'; return; }
    if (m.status !== 'Active') return lockout();
    salonUrl = m.salonUrl;
    const r = await call(salonUrl, { action: 'login', email: email.value, password: pass.value });
    if (r.locked) return lockout();
    if (!r.ok) { msg.textContent = r.error; return; }
    token = r.token; user = r.user;
    document.getElementById('login').style.display = 'none';
    document.getElementById('who').textContent = '(' + esc(user.name) + ' - ' + esc(user.role) + ')';
    if (user.role === 'Staff') { document.body.insertAdjacentHTML('beforeend', '<p style="text-align:center">Your schedule and commission stats arrive in Phase 2.</p>'); return; }
    document.getElementById('pos').style.display = 'block';
    loadServices();
  } catch (e) { msg.textContent = 'Connection problem: ' + e.message; }
}

async function loadServices() {
  const r = await call(salonUrl, { action: 'getServices', token });
  if (r.locked) return lockout();
  services.innerHTML = r.services.map((s, i) =>
    `<div class="svc" onclick='add(${JSON.stringify({name:s.name,price:s.price})})'>${esc(s.category)}: ${esc(s.name)} - ${esc(s.price)}</div>`).join('');
}
function add(item) { cart.push(item); draw(); }
function remove(i) { cart.splice(i, 1); draw(); }
function calc() {
  const sub = cart.reduce((a, i) => a + Number(i.price), 0);
  const d = sub * (Number(disc.value) || 0) / 100;
  return (sub - d) * (1 + (Number(tax.value) || 0) / 100);
}
function draw() {
  document.getElementById('cart').innerHTML = cart.map((c, i) => `<div>${esc(c.name)} - ${esc(c.price)} <a href="#" onclick="remove(${i});return false">remove</a></div>`).join('');
  total.textContent = 'Total: ' + calc().toFixed(2);
}
async function checkout() {
  if (!cart.length) return alert('Cart is empty');
  const r = await call(salonUrl, { action: 'saveSale', token, items: cart, discountPct: disc.value, taxPct: tax.value, method: method.value });
  if (r.locked) return lockout();
  if (!r.ok) return alert(r.error);
  alert('Sale saved! Total: ' + Number(r.total).toFixed(2));
  cart = []; draw();
}
</script></body></html>
